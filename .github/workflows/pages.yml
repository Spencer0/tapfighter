name: Deploy to GitHub Pages

# Publishes the static site to the gh-pages branch, which GitHub Pages serves.
# If Pages is not live yet: Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).
on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: for f in src/*.js; do node --check "$f"; done
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html style.css manifest.webmanifest icon.svg .nojekyll src _site/
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
