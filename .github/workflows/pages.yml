name: Deploy site

# Publishes the game (/) and the wiki (/wiki/) to GitHub Pages.
# Works with either Pages setting: "Deploy from a branch: gh-pages" or "GitHub Actions".
on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

jobs:
  gh-pages-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html style.css manifest.webmanifest icon.svg .nojekyll src wiki _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true

  # Only succeeds when Settings > Pages > Source is "GitHub Actions"; harmless otherwise.
  actions-pages:
    needs: gh-pages-branch
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
